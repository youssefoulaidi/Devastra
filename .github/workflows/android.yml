name: Build QuranPro APK

on:
  push:
    branches: ["arena/01a09c01-convertpro"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned unless keystore.properties exists)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranPro-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
