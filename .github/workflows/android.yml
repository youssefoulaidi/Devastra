name: Build QuranPro APK

on:
  push:
    branches: ["arena/01a09c01-convertpro"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-debug.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Build release APK (unsigned unless keystore.properties exists)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranPro-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Publish GitHub Release with APKs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk QuranPro-v1.0-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk QuranPro-v1.0-release-unsigned.apk || true
          gh release delete quranpro-v1.0 --yes 2>/dev/null || true
          git push origin :quranpro-v1.0 2>/dev/null || true
          git tag -f quranpro-v1.0
          git push origin quranpro-v1.0
          gh release create quranpro-v1.0 QuranPro-v1.0-debug.apk QuranPro-v1.0-release-unsigned.apk \
            --title "QuranPro v1.0 - القرآن الكريم صوت وصورة" \
            --notes "النسخة الأولى من تطبيق القرآن الكريم: استماع ومشاهدة وقراءة بأصوات أكثر من 150 قارئا. الملف الموصى بالتثبيت: QuranPro-v1.0-debug.apk (موقّع وجاهز للتثبيت)."

      - name: Commit installable APK to branch
        if: success()
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          cp QuranPro-v1.0-debug.apk QuranPro-v1.0.apk
          git add -f QuranPro-v1.0.apk
          git commit -m "QuranPro v1.0 APK [skip ci]" || echo "no changes"
          git push origin HEAD:arena/01a09c01-convertpro || true

      - name: Report failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -c 55000 gradle-debug.log; echo '```'; } > tail.txt
          PR=$(gh pr list --head arena/01a09c01-convertpro --json number --jq '.[0].number')
          gh pr comment "$PR" --body-file tail.txt || true
