plugins {
    id 'com.android.application'
}

// Load signing info from keystore.properties (not committed to git)
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    def keystoreProperties = new Properties()
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    keystoreProperties.each { k, v -> project.ext.set(k, v) }
}

// Signing properties: "qp*" preferred, legacy "cp*" kept as fallback.
def signingProp = { String qpName, String legacyName ->
    if (project.hasProperty(qpName)) return project.property(qpName)
    if (project.hasProperty(legacyName)) return project.property(legacyName)
    return null
}
def qpStoreFile = signingProp("qpStoreFile", "cpStoreFile")

android {
    namespace 'com.quranpro.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.quranpro.app"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.5"
        resourceConfigurations += ["en", "ar"]
    }

    signingConfigs {
        release {
            if (qpStoreFile != null) {
                storeFile file(qpStoreFile)
                storePassword signingProp("qpStorePassword", "cpStorePassword")
                keyAlias signingProp("qpKeyAlias", "cpKeyAlias")
                keyPassword signingProp("qpKeyPassword", "cpKeyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (qpStoreFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // Audio & video playback (surah audio, radio, HLS live TV)
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'

    // JSON prefs / models
    implementation 'com.google.code.gson:gson:2.10.1'
    // ListenableFuture for MediaController (explicit, tiny)
    implementation 'com.google.guava:listenablefuture:1.0'
}


// Voices that are *downloaded at build time* into assets/adhan (best effort).
// A curated set is committed to the repository so the adhan always works offline,
// even when the build machine has no network access.
def adhanAssets = [
        [name: 'athan_mishary.mp3',
         url : 'https://raw.githubusercontent.com/abodehq/Athan-MP3/master/Sounds/Athan%20Mishary%20Alafasi.mp3'],
        [name: 'athan_qatami.mp3',
         url : 'https://raw.githubusercontent.com/abodehq/Athan-MP3/master/Sounds/Athan%20Nasser%20Alqatami.mp3'],
        [name: 'athan_chebae.mp3',
         url : 'https://raw.githubusercontent.com/abodehq/Athan-MP3/master/Sounds/Athan%20Al-fajer%20-%20Malek%20chebae.mp3'],
        [name: 'athan_ahmad.mp3',
         url : 'https://raw.githubusercontent.com/abodehq/Athan-MP3/master/Sounds/Athan%20Ahmad%20Nuyne3.mp3'],
        [name: 'athan_makkah.mp3',
         url : 'https://raw.githubusercontent.com/abodehq/Athan-MP3/master/Sounds/Athan%20Makkah.mp3'],
]

/** ID3 tag or an MPEG frame sync → the file really is audio. */
static boolean looksLikeAudio(File f) {
    if (f == null || !f.exists() || f.length() < 100 * 1024) return false
    try {
        byte[] head = new byte[16]
        f.withInputStream { input ->
            if (input.read(head) < 4) return false
        }
        if (head[0] == (byte) 'I' && head[1] == (byte) 'D' && head[2] == (byte) '3') return true
        return (head[0] & 0xFF) == 0xFF && (head[1] & 0xE0) == 0xE0
    } catch (Throwable ignored) {
        return false
    }
}

tasks.register('fetchAdhanAssets') {
    doLast {
        File dir = file('src/main/assets/adhan')
        dir.mkdirs()
        adhanAssets.each { asset ->
            File out = new File(dir, asset.name)
            if (looksLikeAudio(out)) {
                logger.lifecycle("adhan asset ${asset.name} already present (${out.length()} bytes)")
                return
            }
            File part = new File(dir, asset.name + '.part')
            try {
                if (part.exists()) part.delete()
                def conn = new URL(asset.url).openConnection()
                conn.setConnectTimeout(20_000)
                conn.setReadTimeout(60_000)
                conn.setRequestProperty('User-Agent', 'Mozilla/5.0 QuranPro asset fetcher')
                conn.getInputStream().withCloseable { input ->
                    new FileOutputStream(part).withCloseable { output ->
                        byte[] buffer = new byte[32 * 1024]
                        int n
                        while ((n = input.read(buffer)) != -1) {
                            output.write(buffer, 0, n)
                        }
                        output.flush()
                    }
                }
                if (looksLikeAudio(part)) {
                    if (out.exists()) out.delete()
                    if (!part.renameTo(out)) {
                        out.bytes = part.bytes
                        part.delete()
                    }
                    logger.lifecycle("fetched adhan asset ${asset.name} (${out.length()} bytes)")
                } else {
                    logger.lifecycle("adhan asset ${asset.name} unavailable — the app will use the committed voices")
                    part.delete()
                }
            } catch (Throwable ignored) {
                logger.lifecycle("adhan asset ${asset.name} could not be fetched (offline build?)")
                try { part.delete() } catch (Throwable ignored2) {}
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('fetchAdhanAssets'))
}
