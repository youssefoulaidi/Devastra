plugins {
    id 'com.android.application'
}

// Load signing info from keystore.properties (not committed to git)
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    def keystoreProperties = new Properties()
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    keystoreProperties.each { k, v -> project.ext.set(k, v) }
}

// Signing properties: "qp*" preferred, legacy "cp*" kept as fallback.
def signingProp = { String qpName, String legacyName ->
    if (project.hasProperty(qpName)) return project.property(qpName)
    if (project.hasProperty(legacyName)) return project.property(legacyName)
    return null
}
def qpStoreFile = signingProp("qpStoreFile", "cpStoreFile")

android {
    namespace 'com.quranpro.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.quranpro.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
        resourceConfigurations += ["en", "ar"]
    }

    signingConfigs {
        release {
            if (qpStoreFile != null) {
                storeFile file(qpStoreFile)
                storePassword signingProp("qpStorePassword", "cpStorePassword")
                keyAlias signingProp("qpKeyAlias", "cpKeyAlias")
                keyPassword signingProp("qpKeyPassword", "cpKeyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (qpStoreFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // Audio & video playback (surah audio, radio, HLS live TV)
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'

    // JSON prefs / models
    implementation 'com.google.code.gson:gson:2.10.1'
    // ListenableFuture for MediaController (explicit, tiny)
    implementation 'com.google.guava:listenablefuture:1.0'
}
