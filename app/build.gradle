plugins {
    id 'com.android.application'
}

// Load signing info from keystore.properties (not committed to git)
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    def keystoreProperties = new Properties()
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    keystoreProperties.each { k, v -> project.ext.set(k, v) }
}

// Signing properties: "qp*" preferred, legacy "cp*" kept as fallback.
def signingProp = { String qpName, String legacyName ->
    if (project.hasProperty(qpName)) return project.property(qpName)
    if (project.hasProperty(legacyName)) return project.property(legacyName)
    return null
}
def qpStoreFile = signingProp("qpStoreFile", "cpStoreFile")

android {
    namespace 'com.quranpro.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.quranpro.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
        resourceConfigurations += ["en", "ar"]
    }

    signingConfigs {
        release {
            if (qpStoreFile != null) {
                storeFile file(qpStoreFile)
                storePassword signingProp("qpStorePassword", "cpStorePassword")
                keyAlias signingProp("qpKeyAlias", "cpKeyAlias")
                keyPassword signingProp("qpKeyPassword", "cpKeyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (qpStoreFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // Audio & video playback (surah audio, radio, HLS live TV)
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'

    // JSON prefs / models
    implementation 'com.google.code.gson:gson:2.10.1'
    // ListenableFuture for MediaController (explicit, tiny)
    implementation 'com.google.guava:listenablefuture:1.0'
}


def adhanAssets = [
        [name: 'athan_mishary.mp3', url: 'https://raw.githubusercontent.com/abodehq/Athan-MP3/master/Sounds/Athan%20Mishary%20Alafasi.mp3'],
        [name: 'athan_makkah.mp3',  url: 'https://raw.githubusercontent.com/abodehq/Athan-MP3/master/Sounds/Athan%20Makkah.mp3'],
]

tasks.register('fetchAdhanAssets') {
    doLast {
        try {
            File dir = file('src/main/assets/adhan')
            dir.mkdirs()
            adhanAssets.each { asset ->
                File out = new File(dir, asset.name)
                File part = new File(dir, asset.name + '.part')
                try {
                    if (!(out.exists() && out.length() > 200 * 1024)) {
                        if (part.exists()) part.delete()
                        def conn = new URL(asset.url).openConnection()
                        conn.setConnectTimeout(20_000)
                        conn.setReadTimeout(40_000)
                        conn.setRequestProperty('User-Agent', 'QuranPro asset fetcher')
                        conn.getInputStream().withCloseable { input ->
                            new FileOutputStream(part).withCloseable { output ->
                                byte[] buffer = new byte[16 * 1024]
                                int n
                                while ((n = input.read(buffer)) != -1) {
                                    output.write(buffer, 0, n)
                                }
                                output.flush()
                            }
                        }
                        if (part.exists() && part.length() > 200 * 1024) {
                            if (out.exists()) out.delete()
                            if (!part.renameTo(out)) {
                                out.bytes = part.bytes
                                part.delete()
                            }
                        } else if (part.exists()) {
                            part.delete()
                        }
                    }
                } catch (Throwable ignored) {
                    try { part.delete() } catch (Throwable ignored2) {}
                }
            }
        } catch (Throwable ignored) {
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('fetchAdhanAssets'))
}
